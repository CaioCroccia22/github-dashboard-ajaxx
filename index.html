<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard Github</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <img src="https://placehold.co/600x400.png" id="profile-picture" alt="" class="profile-picture">
            <h1>Caio Croccia Pereira de Carvalho</h1>
            <h3 id="nome"></h3>
            <div class="container-body">
                <div class="body-section">
                    <h5>Repositórios</h5>
                    <span id="repositorios">5</span>
                </div>
                <div class="body-section">
                    <h5>Seguidores</h5>
                    <span id="seguidores">5</span>
                </div>
                <div class="body-section">
                    <h5>Seguindo</h5>
                    <span id="seguindo">5</span>
                </div>
                <button id="button" class="btn btn-secondary m-5 container-btn">
                    Clique aqui para importar
                </button>
            </div>
        </div>
    </header>
</body>
</html>
